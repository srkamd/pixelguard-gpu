name: Build Android APK & AAB Bundle

on:
  workflow_dispatch: # Allows manual 1-click trigger from GitHub web UI
  push:
    branches:
      - main
    paths:
      - 'mobile_app/**'
      - '.github/workflows/build_apk.yml'

jobs:
  build:
    name: Build Mobile Release Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate and Setup Gradle Wrapper
        run: |
          cd mobile_app/android
          gradle wrapper --gradle-version 8.3
          chmod +x gradlew

      - name: Build Android Release APK (Direct Phone Install)
        run: |
          cd mobile_app/android
          ./gradlew assembleRelease --stacktrace

      - name: Build Android Release Bundle (Google Play Store AAB)
        run: |
          cd mobile_app/android
          ./gradlew bundleRelease --stacktrace

      - name: Upload APK Artifact (Direct Phone Install)
        uses: actions/upload-artifact@v4
        with:
          name: PixelGuard-Release-APK
          path: mobile_app/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload AAB Artifact (Google Play Console Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: PixelGuard-GooglePlay-AAB
          path: mobile_app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
